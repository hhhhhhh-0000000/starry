<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STARLEAP - 별의 계단</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold: #d9b45a; --gold-l: #f6e3a1; --gold-d: #8a6a2a; --ink: #0a0c18; --navy: #111632; --navy2: #1a2147;
    --text: #efe6cf; --muted: #a9a3b8; --serif: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif; --display: "Cinzel", "Noto Serif KR", serif;
  }
  html, body { width: 100%; height: 100%; background: #05060d; overflow: hidden; font-family: var(--serif); color: var(--text); user-select: none; -webkit-user-select: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #0d1026 0%, #04050b 75%); }
  #stage { position: relative; overflow: hidden; box-shadow: 0 0 0 1px rgba(217,180,90,.25), 0 30px 80px rgba(0,0,0,.7); container-type: size; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; width: 100%; height: 100%; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%); }
  .gold-text { background: linear-gradient(180deg, #fff6d6 0%, #f2d58a 35%, #c99a3e 60%, #f6e3a1 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .caps { font-family: var(--display); letter-spacing: .32em; text-transform: uppercase; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 2.2cqh 2.2cqw; pointer-events: none; opacity: 0; transform: translateY(-8px); transition: opacity .5s, transform .5s; }
  #hud.on { opacity: 1; transform: none; }
  .panel { position: relative; background: linear-gradient(180deg, rgba(20,24,54,.78), rgba(8,10,24,.78)); border: 1px solid rgba(217,180,90,.55); box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,240,200,.08), 0 6px 18px rgba(0,0,0,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .panel::before, .panel::after { content: ""; position: absolute; width: 7px; height: 7px; border: 1px solid var(--gold); transform: rotate(45deg); background: var(--ink); top: 50%; margin-top: -4px; }
  .panel::before { left: -4px; } .panel::after { right: -4px; }
  .hud-stage { padding: .9cqh 1.8cqw .9cqh 1.4cqw; display: flex; align-items: center; gap: 1.2cqw; }
  .hud-num { font-family: var(--display); font-size: 4.4cqh; font-weight: 700; line-height: 1; }
  .hud-name { display: flex; flex-direction: column; gap: .3cqh; }
  .hud-name small { font-family: var(--display); font-size: 1.9cqh; letter-spacing: .3em; color: var(--gold); }
  .hud-name span { font-size: 2.9cqh; font-weight: 600; letter-spacing: .05em; }
  .hud-stats { display: flex; align-items: center; padding: .8cqh 1.2cqw; gap: 1.6cqw; font-size: 2.8cqh; }
  .stat { display: flex; align-items: center; gap: .7cqw; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-family: var(--display); font-size: 1.8cqh; letter-spacing: .2em; color: var(--muted); }
  .sep { width: 1px; height: 3.4cqh; background: linear-gradient(transparent, rgba(217,180,90,.6), transparent); }
  .gem-ico { width: 1.9cqh; height: 1.9cqh; transform: rotate(45deg); background: linear-gradient(135deg, #fff6c0, #ffd84a 45%, #b8860b); box-shadow: 0 0 6px rgba(255,216,74,.7); flex: none; }
  .gem-ico.empty { background: transparent; border: 1px solid rgba(217,180,90,.5); box-shadow: none; }
  #pauseBtn { pointer-events: auto; cursor: pointer; width: 5.6cqh; height: 5.6cqh; border-radius: 50%; border: 1px solid var(--gold); background: radial-gradient(circle at 35% 30%, #2a3166, #0b0e22); display: flex; align-items: center; justify-content: center; gap: .6cqh; box-shadow: 0 0 0 3px rgba(10,12,24,.7), 0 0 0 4px rgba(217,180,90,.35); transition: box-shadow .3s; }
  #pauseBtn:hover { box-shadow: 0 0 0 3px rgba(10,12,24,.7), 0 0 0 4px rgba(217,180,90,.9), 0 0 16px rgba(217,180,90,.5); }
  #pauseBtn i { display: block; width: .6cqh; height: 2.2cqh; background: var(--gold-l); }

  /* ---------- screens ---------- */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3cqh; padding: 4cqh 4cqw; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .55s ease, visibility .55s; }
  .screen.on { opacity: 1; visibility: visible; pointer-events: auto; }
  .screen.dim { background: radial-gradient(ellipse at center, rgba(12,15,38,.82) 0%, rgba(3,4,10,.94) 100%); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .screen > * { transform: translateY(14px); opacity: 0; transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .7s; }
  .screen.on > * { transform: none; opacity: 1; }
  .screen.on > *:nth-child(2) { transition-delay: .08s; } .screen.on > *:nth-child(3) { transition-delay: .16s; }
  .screen.on > *:nth-child(4) { transition-delay: .24s; } .screen.on > *:nth-child(5) { transition-delay: .32s; } .screen.on > *:nth-child(6) { transition-delay: .4s; }

  .frame { position: absolute; inset: 2.6cqh 2cqw; border: 1px solid rgba(217,180,90,.45); pointer-events: none; }
  .frame::before { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(217,180,90,.18); }
  .corner { position: absolute; width: 5cqh; height: 5cqh; border-color: var(--gold); border-style: solid; }
  .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; } .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; } .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .corner::after { content: ""; position: absolute; width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .corner.tl::after { top: -4px; left: -4px; } .corner.tr::after { top: -4px; right: -4px; } .corner.bl::after { bottom: -4px; left: -4px; } .corner.br::after { bottom: -4px; right: -4px; }

  .title { font-family: var(--display); font-weight: 700; font-size: 13cqh; letter-spacing: .14em; line-height: 1; filter: drop-shadow(0 4px 0 rgba(60,40,10,.6)) drop-shadow(0 0 24px rgba(217,180,90,.35)); animation: shimmer 6s ease-in-out infinite; background-size: 100% 200%; }
  @keyframes shimmer { 0%,100% { background-position: 0 0; } 50% { background-position: 0 100%; } }
  .title.md { font-size: 9cqh; }
  .divider { display: flex; align-items: center; gap: 1.4cqw; color: var(--gold); font-size: 3.2cqh; letter-spacing: .5em; }
  .divider::before, .divider::after { content: ""; width: 12cqw; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .divider::after { background: linear-gradient(90deg, var(--gold), transparent); }
  .divider b { display: inline-block; width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); }
  .sub { font-size: 3.4cqh; letter-spacing: .6em; color: var(--gold-l); font-weight: 600; padding-left: .6em; }
  .lead { font-size: 2.7cqh; color: var(--muted); font-style: italic; letter-spacing: .05em; }

  #stageList { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1.2cqh 1.2cqw; width: 86cqw; }
  .card { position: relative; cursor: pointer; padding: 1.1cqh 1cqw 1.1cqh; background: linear-gradient(180deg, rgba(28,33,74,.85), rgba(10,12,28,.9)); border: 1px solid rgba(217,180,90,.4); color: var(--text); font-family: var(--serif); display: flex; flex-direction: column; align-items: center; gap: .5cqh; overflow: hidden; transition: transform .3s, border-color .3s, box-shadow .3s; }
  .card::after { content: ""; position: absolute; top: 0; left: -120%; width: 60%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,240,200,.16), transparent); transform: skewX(-20deg); transition: left .7s; }
  .card:hover:not(.locked), .card:focus-visible { transform: translateY(-4px); border-color: var(--gold-l); box-shadow: 0 10px 24px rgba(0,0,0,.5), 0 0 18px rgba(217,180,90,.3); outline: none; }
  .card:hover:not(.locked)::after { left: 140%; }
  .card .rn { font-family: var(--display); font-size: 3.6cqh; font-weight: 700; line-height: 1; }
  .card .nm { font-size: 2.4cqh; font-weight: 600; letter-spacing: .08em; }
  .card .ln { width: 40%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .card .rec { font-size: 1.9cqh; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 2.4cqh; }
  .card .gems { display: flex; gap: .9cqh; }
  .card .gems .gem-ico { width: 1.5cqh; height: 1.5cqh; }
  #stageList:has(.wide) { grid-template-columns: repeat(auto-fit, minmax(15cqw, 19cqw)); justify-content: center; }
  .card.wide { padding: 2cqh 1cqw; }
  .card.wide .rn { font-size: 4.6cqh; }
  .card.back { opacity: .8; }
  .hardtag { position: absolute; top: .6cqh; right: .6cqw; font-size: 1.5cqh; letter-spacing: .1em; color: #fff; background: linear-gradient(180deg, #c02a3a, #7a0e1a); padding: .2cqh .6cqw; border: 1px solid #ff8a9a; }
  .card.locked { cursor: default; filter: grayscale(.9) brightness(.55); }
  .card.locked .rn { color: #6c6780; background: none; -webkit-text-fill-color: #6c6780; }
  .lock { width: 2.4cqh; height: 1.8cqh; border: 1px solid #8a8496; border-radius: 2px; position: relative; margin: 1.6cqh 0 .6cqh; }
  .lock::before { content: ""; position: absolute; left: 50%; top: -1.6cqh; width: 1.4cqh; height: 1.6cqh; margin-left: -.7cqh; border: 1px solid #8a8496; border-bottom: 0; border-radius: 1cqh 1cqh 0 0; }

  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: .8cqh 2.4cqw; font-size: 2.1cqh; color: var(--muted); }
  .keys span { display: inline-flex; align-items: center; gap: .6cqw; }
  kbd { font-family: var(--display); font-size: 1.8cqh; color: var(--gold-l); border: 1px solid rgba(217,180,90,.55); border-bottom-width: 2px; padding: .2cqh .8cqh; background: rgba(10,12,28,.7); }

  .btn { position: relative; overflow: hidden; font-family: var(--serif); font-weight: 600; font-size: 2.8cqh; letter-spacing: .14em; color: var(--gold-l); background: linear-gradient(180deg, #1d2350, #0c0f26); border: 1px solid var(--gold); padding: 1.6cqh 3.6cqw; min-width: 26cqw; cursor: pointer; box-shadow: inset 0 0 0 3px #0a0c18, inset 0 0 0 4px rgba(217,180,90,.25), 0 6px 18px rgba(0,0,0,.5); transition: color .3s, box-shadow .3s, transform .2s; }
  .btn::after { content: ""; position: absolute; top: 0; left: -120%; width: 50%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,240,200,.22), transparent); transform: skewX(-20deg); transition: left .6s; }
  .btn:hover, .btn:focus-visible { color: #fff8e0; outline: none; box-shadow: inset 0 0 0 3px #0a0c18, inset 0 0 0 4px rgba(217,180,90,.7), 0 0 22px rgba(217,180,90,.35), 0 6px 18px rgba(0,0,0,.5); }
  .btn:hover::after { left: 140%; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: linear-gradient(180deg, #e9c770, #b68a34); color: #1a1206; border-color: #fff0c0; box-shadow: inset 0 0 0 3px rgba(255,248,220,.35), 0 0 20px rgba(217,180,90,.35), 0 6px 18px rgba(0,0,0,.5); }
  .btn.primary:hover { color: #000; }
  .col { display: flex; flex-direction: column; gap: 1.6cqh; align-items: center; }
  .row { display: flex; gap: 1.6cqw; flex-wrap: wrap; justify-content: center; }
  .ghost { background: none; border: 0; color: var(--muted); font-family: var(--serif); font-size: 2.3cqh; letter-spacing: .1em; cursor: pointer; padding: .6cqh 1cqw; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  .ghost:hover { color: var(--gold-l); border-color: var(--gold); }

  .sheet { position: relative; min-width: 52cqw; padding: 4cqh 5cqw 3.4cqh; }
  .stats { width: 100%; border-collapse: collapse; font-size: 2.9cqh; }
  .stats td { padding: 1.3cqh 1cqw; border-bottom: 1px solid rgba(217,180,90,.18); }
  .stats td:first-child { text-align: left; font-family: var(--display); letter-spacing: .25em; font-size: 2cqh; color: var(--muted); }
  .stats td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .stats .gemrow { display: inline-flex; gap: 1.2cqh; vertical-align: middle; margin-right: 1cqw; }
  .badge { display: inline-block; margin-left: 1cqw; font-family: var(--display); font-size: 1.6cqh; letter-spacing: .2em; color: #1a1206; background: linear-gradient(180deg, #f6e3a1, #c99a3e); padding: .3cqh .9cqh; vertical-align: middle; }

  /* ---------- banner ---------- */
  #bTutorial { color: var(--gold-l); border-bottom: 1px solid rgba(217,180,90,.5); }
  #bTutorial.glow { color: #fff6d0; text-shadow: 0 0 1.4cqh rgba(246,227,161,.9); border-bottom-color: #f6e3a1; }
  #tip { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); width: 72%; padding: 1.4cqh 2.4cqw; border: 1px solid rgba(217,180,90,.8); border-radius: 1cqh; background: rgba(8,10,24,.88); color: #f6e3a1; font-family: 'Noto Serif KR', serif; font-size: 3.2cqh; line-height: 1.5; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: pre-line; }
  #tip.on { opacity: 1; }
  #tip b { color: #fff; }
  #banner { position: absolute; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 1.4cqh; }
  #banner > * { opacity: 0; transform: translateY(10px); transition: opacity .8s, transform .8s; }
  #banner.on > * { opacity: 1; transform: none; }
  #banner.on > *:nth-child(2) { transition-delay: .15s; } #banner.on > *:nth-child(3) { transition-delay: .3s; } #banner.on > *:nth-child(4) { transition-delay: .45s; }
  #banner .n { font-family: var(--display); font-size: 2.6cqh; letter-spacing: .6em; color: var(--gold); padding-left: .6em; }
  #banner .t { font-size: 9cqh; font-weight: 700; letter-spacing: .12em; filter: drop-shadow(0 3px 0 rgba(0,0,0,.7)) drop-shadow(0 0 18px rgba(0,0,0,.6)); }
  #banner .a { max-width: 70cqw; font-size: 2.6cqh; font-style: italic; color: var(--text); background: linear-gradient(90deg, transparent, rgba(8,10,24,.85) 15%, rgba(8,10,24,.85) 85%, transparent); padding: 1.2cqh 8cqw; border-top: 1px solid rgba(217,180,90,.35); border-bottom: 1px solid rgba(217,180,90,.35); line-height: 1.6; }
  #fade { position: absolute; inset: 0; background: #05060d; pointer-events: none; opacity: 0; transition: opacity .45s; }
  #fade.on { opacity: 1; }

  /* ---------- touch ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  .tb { position: absolute; pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(217,180,90,.75); background: radial-gradient(circle at 35% 30%, rgba(42,49,102,.75), rgba(8,10,24,.75)); box-shadow: 0 0 0 3px rgba(8,10,24,.5), 0 0 0 4px rgba(217,180,90,.25); display: flex; align-items: center; justify-content: center; color: var(--gold-l); font-family: var(--serif); font-weight: 600; font-size: 14px; letter-spacing: .1em; transition: background .1s; }
  .tb::after { content: attr(data-key); position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px; white-space: nowrap; font-family: var(--serif); font-weight: 600; font-size: 10px; letter-spacing: .05em; line-height: 1; color: rgba(246,227,161,.9); text-shadow: 0 0 3px #080a18, 0 1px 2px #080a18; pointer-events: none; }
  .tb[data-k="up"]::after { top: auto; bottom: 100%; margin: 0 0 3px; }
  #touch.edit .tb { outline: 2px dashed #f6e3a1; outline-offset: 4px; }
  .tbx { position: absolute; right: 12px; top: 72px; pointer-events: auto; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(217,180,90,.75); background: rgba(8,10,24,.8); color: var(--gold-l); font-family: var(--serif); font-size: 12px; letter-spacing: .08em; }
  .tbx.on { background: rgba(185,138,52,.85); color: #1a1206; }
  .tbx-r { position: absolute; right: 12px; top: 116px; pointer-events: auto; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(217,180,90,.75); background: rgba(8,10,24,.8); color: var(--gold-l); font-family: var(--serif); font-size: 12px; display: none; }
  #touch.edit .tbx-r { display: block; }
  .tb.down { background: radial-gradient(circle at 35% 30%, rgba(246,227,161,.65), rgba(185,138,52,.6)); color: #1a1206; }
  .tri { width: 0; height: 0; border: 9px solid transparent; }
  .tri.l { border-right: 12px solid var(--gold-l); border-left: 0; }
  .tri.r { border-left: 12px solid var(--gold-l); border-right: 0; }
  .tri.u { border-bottom: 12px solid var(--gold-l); border-top: 0; }
  .tri.d { border-top: 12px solid var(--gold-l); border-bottom: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="320" height="180"></canvas>
    <div id="vignette"></div>
    <div id="hud">
      <div class="panel hud-stage"><div class="hud-num gold-text" id="hudNum">I</div><div class="hud-name"><small>STAGE</small><span id="hudName">새벽 숲</span></div></div>
      <div class="panel hud-stats">
        <div class="stat"><div class="gem-ico"></div><span id="hudGem">0 / 0</span></div>
        <div class="sep"></div>
        <div class="stat"><span class="lbl">DEATHS</span><span id="hudDeath">0</span></div>
        <div class="sep"></div>
        <div class="stat"><span class="lbl">TIME</span><span id="hudTime">00:00.0</span></div>
        <div id="pauseBtn" title="일시정지"><i></i><i></i></div>
      </div>
    </div>
    <div id="tip"></div>
    <div id="banner"><div class="n" id="bnN"></div><div class="t gold-text" id="bnT"></div><div class="divider"><b></b></div><div class="a" id="bnA"></div></div>

    <div class="screen on" id="scTitle" style="gap:2.2cqh">
      <div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
      <div class="title gold-text">STARLEAP</div>
      <div class="divider"><b></b></div>
      <div class="sub" id="titleSub">별 의 계 단</div>
      <button class="ghost" id="bTutorial" onclick="startStage(TUT_STAGE)" style="letter-spacing:.18em">BEFORE THE STORY  ·  튜토리얼</button>
      <div id="stageList"></div>
      <button class="ghost" id="bBackWorld" style="display:none" onclick="menuWorld=null;buildMenu()">&larr; 월드 선택으로</button>
      <div class="keys">
        <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> 이동</span><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> 조준</span>
        <span><kbd>SPACE</kbd><kbd>Z</kbd> 점프</span><span><kbd>X</kbd><kbd>SHIFT</kbd> 대시</span><span><kbd>C</kbd><kbd>L</kbd> 대시 점프</span>
        <span><kbd>V</kbd> 채찍</span><span><kbd>B</kbd> 별빛탄</span><span><kbd>F</kbd> 방어</span>
        <span><kbd>R</kbd> 재시작</span><span><kbd>ESC</kbd> 일시정지</span>
      </div>
    </div>

    <div class="screen dim" id="scPause">
      <div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
      <div class="title md gold-text">PAUSED</div>
      <div class="divider"><b></b></div>
      <div class="col">
        <button class="btn primary" id="bResume">계속하기</button>
        <button class="btn" id="bRetry">스테이지 처음부터</button>
        <button class="btn" id="bMenu">스테이지 선택</button>
      </div>
      <button class="ghost" id="bSound">효과음 : 켜짐</button>
    </div>

    <div class="screen dim" id="scClear">
      <div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
      <div class="n caps" style="color:var(--gold);font-size:2.4cqh" id="clearSub">STAGE I</div>
      <div class="title md gold-text">STAGE CLEAR</div>
      <div class="panel sheet"><table class="stats" id="clearStats"></table></div>
      <div class="row">
        <button class="btn primary" id="bNext">다음 스테이지</button>
        <button class="btn" id="bAgain">다시 도전</button>
      </div>
      <button class="ghost" id="bMenu2">스테이지 선택으로</button>
    </div>

function drawPlayerAt(px, py, face, sx, sy, scarf, ghost) {

function scarfColor() {

function drawPlayer() {

  const ty = clamp(p.y + 7 - VH / 2 - 10, 0, Math.max(0, L.ph - VH));
  if (!p.dead) { cam.x += (tx - cam.x) * 0.1; cam.y += (ty - cam.y) * 0.1; }
  if (L.pw < VW) cam.x = (L.pw - VW) / 2;
}
// ---------- UI ----------
const $ = id => document.getElementById(id);
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII"];
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function fmt(fr) { const s = fr / 60; const m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + (s % 60).toFixed(1).padStart(4, "0"); }
function gemIcons(n, total) { let h = ""; for (let k = 0; k < total; k++) h += "<i class='gem-ico" + (k < n ? "" : " empty") + "'></i>"; return h; }
function stageGemTotal(i) { return LEVELS[i].map.join("").split("*").length - 1; }
let bannerTO = null;
function showBanner(i) {
  $("bnN").textContent = STAGES[i].tutorial ? "TUTORIAL  ·  튜토리얼" : "STAGE " + stageCode(i) + "  ·  " + WORLDS[STAGES[i].w] + (STAGES[i].hard ? "  ·  " + STAGES[i].hardTag : ""); $("bnT").textContent = STAGES[i].name; $("bnA").textContent = STAGES[i].ability + (STAGES[i].w === 11 ? "  ·  목도리 검: 이곳에서는 목도리에 검을 묶어 채찍 대신 검격(V)으로 베어냅니다. 더 넓게, 두 배로 아프게" : "");
  $("banner").classList.remove("on"); void $("banner").offsetWidth;
  $("banner").classList.add("on"); clearTimeout(bannerTO); bannerTO = setTimeout(() => $("banner").classList.remove("on"), 3600);
}
let menuWorld = null;
function buildMenu() {
  const el = $("stageList"); el.innerHTML = "";
  const tb = $("bTutorial"); if (tb) { tb.style.display = menuWorld === null ? "" : "none"; tb.classList.toggle("glow", !save.tutDone); }
  $("titleSub").textContent = menuWorld === null ? "별 의 계 단" : "WORLD " + ROMAN[menuWorld] + "  ·  " + WORLDS[menuWorld];
  if (menuWorld === null) {
    WORLDS.forEach((wn, w) => {
      const idx = STAGES.map((s, i) => i).filter(i => STAGES[i].w === w);
      const open = idx[0] < save.unlocked;
      const cleared = idx.filter(i => save.best[i]).length;
      const got = idx.reduce((a, i) => a + (save.best[i] ? save.best[i].g : 0), 0), tot = idx.reduce((a, i) => a + stageGemTotal(i), 0);
      const b = document.createElement("button"); b.className = "card" + (open ? "" : " locked");
      b.innerHTML = "<div class='rn gold-text'>" + ROMAN[w] + "</div><div class='nm'>" + wn + "</div><div class='ln'></div>" +
        (open ? "<div class='rec'>" + cleared + " / " + idx.length + " 클리어</div><div class='rec'><i class='gem-ico' style='display:inline-block;width:1.3cqh;height:1.3cqh;margin-right:.8cqh'></i>" + got + " / " + tot + "</div>" : "<div class='lock'></div>");
      b.onclick = () => { if (!open) return; if (idx.length === 1) startStage(idx[0]); else { menuWorld = w; buildMenu(); } };
      el.appendChild(b);
    });
  } else {
    STAGES.forEach((s, i) => {
      if (s.w !== menuWorld) return;
      const open = i < save.unlocked, best = save.best[i];
      const b = document.createElement("button"); b.className = "card wide" + (open ? "" : " locked");
      b.innerHTML = (s.hard ? "<div class='hardtag'>" + s.hardTag + "</div>" : "") + "<div class='rn gold-text'>" + stageCode(i) + "</div><div class='nm'>" + s.name + "</div><div class='ln'></div>" +
        (open ? "<div class='rec'>" + (best ? fmt(best.t) : "기록 없음") + "</div><div class='gems'>" + gemIcons(best ? best.g : 0, stageGemTotal(i)) + "</div>" : "<div class='lock'></div>");
      b.onclick = () => { if (open) startStage(i); };
      el.appendChild(b);
    });
  }
  $("bBackWorld").style.display = menuWorld === null ? "none" : "inline-block";
  $("titleSub").style.letterSpacing = menuWorld === null ? "" : ".25em";
}
let transitioning = false;
// ---- touch button layout (drag to move, saved per browser) ----
const LAYOUT_KEY = "starleap_touch_layout_v1";
let editMode = false, dragging = null;
const DEFAULT_TB = {};
document.querySelectorAll(".tb").forEach(b => { DEFAULT_TB[b.dataset.k] = b.getAttribute("style") || ""; });
function saveTouchLayout() {
  const o = {};
  document.querySelectorAll(".tb").forEach(b => { o[b.dataset.k] = [b.offsetLeft, b.offsetTop]; });
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(o)); } catch (e) {}
}
function placeTb(b, x, y) {
  const maxX = Math.max(0, window.innerWidth - b.offsetWidth), maxY = Math.max(0, window.innerHeight - b.offsetHeight);
  b.style.left = Math.min(maxX, Math.max(0, x)) + "px"; b.style.top = Math.min(maxY, Math.max(0, y)) + "px";
  b.style.right = "auto"; b.style.bottom = "auto";
}
function loadTouchLayout() {
  let o = null;
  try { o = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "null"); } catch (e) {}
  if (!o) return;
  document.querySelectorAll(".tb").forEach(b => { const p = o[b.dataset.k]; if (p) placeTb(b, p[0], p[1]); });
}
function resetTouchLayout() {
  document.querySelectorAll(".tb").forEach(b => { if (DEFAULT_TB[b.dataset.k] !== undefined) b.setAttribute("style", DEFAULT_TB[b.dataset.k]); });
  try { localStorage.removeItem(LAYOUT_KEY); } catch (e) {}
  updateTouchAb();
}
document.querySelectorAll(".tb").forEach(b => {
  b.addEventListener("pointerdown", e => {
    if (!editMode) return;
    e.preventDefault(); e.stopPropagation();
    const r = b.getBoundingClientRect();
    dragging = { b, dx: e.clientX - r.left, dy: e.clientY - r.top, id: e.pointerId };
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
  });
  b.addEventListener("pointermove", e => {
    if (!dragging || dragging.b !== b || dragging.id !== e.pointerId) return;
    e.preventDefault(); placeTb(b, e.clientX - dragging.dx, e.clientY - dragging.dy);
  });
  const end = e => { if (dragging && dragging.b === b) { dragging = null; saveTouchLayout(); } };
  b.addEventListener("pointerup", end); b.addEventListener("pointercancel", end);
});
document.getElementById("tbEdit").addEventListener("click", e => {
  e.stopPropagation(); editMode = !editMode;
  touchEl.classList.toggle("edit", editMode);
  const btn = document.getElementById("tbEdit"); btn.classList.toggle("on", editMode); btn.textContent = editMode ? "배치 완료" : "배치";
  if (editMode) { document.getElementById("tbEdit").style.pointerEvents = "auto"; }
});
document.getElementById("tbEdit").addEventListener("pointerdown", e => e.stopPropagation());
document.getElementById("tbReset").addEventListener("click", e => { e.stopPropagation(); resetTouchLayout(); });
document.getElementById("tbReset").addEventListener("pointerdown", e => e.stopPropagation());
loadTouchLayout();
function updateTouchAb() { const dj = document.getElementById("tbDJ"); if (dj && L) dj.style.display = L.ab.dash ? "flex" : "none"; }
function startStage(i) {
  if (transitioning) return;
  { const el = $("tip"); if (el) { el.classList.remove("on"); el.dataset.k = ""; } }
  audio(); transitioning = true; $("fade").classList.add("on");
  setTimeout(() => {
    loadStage(i); updateTouchAb(); state = "play"; show(null); $("hud").classList.add("on"); touchEl.classList.toggle("on", isTouch); updateHud();
    $("fade").classList.remove("on"); transitioning = false;
  }, 450);
}
function toMenu() {
  if (transitioning) return;
  { const el = $("tip"); if (el) { el.classList.remove("on"); el.dataset.k = ""; } }
  transitioning = true; $("fade").classList.add("on");
  setTimeout(() => {
    state = "title"; menuWorld = STAGES[stageIdx] ? (STAGES.filter(s => s.w === STAGES[stageIdx].w).length > 1 ? STAGES[stageIdx].w : null) : null; buildMenu(); show("scTitle"); $("hud").classList.remove("on"); touchEl.classList.remove("on"); touchEl.classList.remove("edit"); $("banner").classList.remove("on");
    $("fade").classList.remove("on"); transitioning = false;
  }, 450);
}
function togglePause() {
  if (state === "play") { state = "pause"; show("scPause"); for (const k in keys) keys[k] = false; }
  else if (state === "pause") { state = "play"; show(null); }
}
function statRow(label, value) { return "<tr><td>" + label + "</td><td>" + value + "</td></tr>"; }
function finishStage() {
  state = "clear"; SFX.clear();
  const got = L.ents.filter(e => e.t === "gem" && e.got).length;
  const prev = save.best[stageIdx];
  const rec = { t: prev ? Math.min(prev.t, runFrames) : runFrames, g: prev ? Math.max(prev.g, got) : got, d: prev ? Math.min(prev.d, deaths) : deaths };
  const newRec = !prev || runFrames < prev.t;
  save.best[stageIdx] = rec; if (STAGES[stageIdx].tutorial) save.tutDone = true; else save.unlocked = Math.max(save.unlocked, Math.min(LAST_STAGE + 1, stageIdx + 2)); writeSave();
  touchEl.classList.remove("on"); touchEl.classList.remove("edit"); $("hud").classList.remove("on");
  if (stageIdx === LAST_STAGE) {
    let tt = 0, tg = 0, td = 0, total = 0;
    STAGES.forEach((s, i) => { if (s.tutorial) return; const b = save.best[i]; if (b) { tt += b.t; tg += b.g; td += b.d; } total += stageGemTotal(i); });
    $("endStats").innerHTML =
      statRow("FINAL STAGE", fmt(runFrames) + (newRec ? "<span class='badge'>NEW RECORD</span>" : "")) +
      statRow("BEST TOTAL TIME", fmt(tt)) +
      statRow("BEST DEATHS", td) +
      statRow("STAR SHARDS", tg + " / " + total);
    show("scEnd"); return;
  }
  $("bNext").textContent = STAGES[stageIdx].tutorial ? "이야기 시작" : "다음 스테이지";
  $("clearSub").textContent = "STAGE " + stageCode(stageIdx) + "  ·  " + STAGES[stageIdx].name;
  $("clearStats").innerHTML =
    statRow("TIME", fmt(runFrames) + (newRec ? "<span class='badge'>NEW RECORD</span>" : "")) +
    statRow("BEST", fmt(rec.t)) +
    statRow("DEATHS", deaths) +
    statRow("STAR SHARDS", "<span class='gemrow'>" + gemIcons(got, L.gemTotal) + "</span>" + got + " / " + L.gemTotal);
  show("scClear");
}
$("bResume").onclick = () => togglePause();
$("bRetry").onclick = () => startStage(stageIdx);
$("bMenu").onclick = toMenu; $("bMenu2").onclick = toMenu; $("bMenu3").onclick = toMenu;
$("bNext").onclick = () => startStage(STAGES[stageIdx].tutorial ? 0 : Math.min(stageIdx + 1, LAST_STAGE));
$("bAgain").onclick = () => startStage(stageIdx);
$("pauseBtn").onclick = () => togglePause();
function soundLabel() { $("bSound").textContent = "효과음 : " + (save.sound ? "켜짐" : "꺼짐"); }
$("bSound").onclick = () => { save.sound = !save.sound; writeSave(); soundLabel(); };
soundLabel();

function updateHud() {
  $("hudNum").textContent = stageCode(stageIdx);
  $("hudName").textContent = L.glitch && Math.random() < 0.25 ? STAGES[stageIdx].name.split("").map(c => Math.random() < 0.5 ? "▓▒░■"[Math.random() * 4 | 0] : c).join("") : STAGES[stageIdx].name;
  $("hudGem").textContent = L.ents.filter(e => e.t === "gem" && e.got).length + " / " + L.gemTotal;
  $("hudDeath").textContent = deaths; $("hudTime").textContent = fmt(runFrames);
}

// ---------- title demo background ----------
function drawTitleBg() {
  const gr = ctx.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, "#05040f"); gr.addColorStop(1, "#2a1a5a");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 80; i++) { const x = (hash(i, 1) % VW + frame * 0.1 * (1 + i % 3)) % VW; const y = hash(i, 2) % VH; ctx.fillStyle = i % 7 === 0 ? "#ffd84a" : "#ffffff"; ctx.globalAlpha = 0.3 + (i % 3) * 0.25; ctx.fillRect(x | 0, y, 1, 1); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#1c1440"; for (let x = 0; x < VW; x += 8) ctx.fillRect(x, VH - 30 - (hash(x, 5) % 20), 8, 60);
  ctx.fillStyle = "rgba(217,180,90,0.05)"; ctx.beginPath(); ctx.arc(160, 200, 150, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#0e0a24"; for (let x = 0; x < VW; x += 6) ctx.fillRect(x, VH - 14 - (hash(x, 9) % 10), 6, 40);
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
function step() {
  frame++;
  if (state === "play") {
    if (freeze > 0) { freeze--; } else {
      updateWorld(); updatePlayer(); updateParts(); updateCam();
      if (state === "play") runFrames++;
    }
    pressed.jump = false; pressed.dash = false; pressed.djump = false; pressed.atk = false; pressed.sp = false; pressed.guard = false;
    if (shake > 0) shake *= 0.85, shake < 0.3 && (shake = 0);
    if (frame % 6 === 0 && L) updateHud();
  } else { pressed.jump = false; pressed.dash = false; pressed.djump = false; pressed.atk = false; pressed.sp = false; pressed.guard = false; }
}
function glitchFx() {
  ctx.fillStyle = "rgba(0,0,0,0.18)"; for (let y = 0; y < VH; y += 2) ctx.fillRect(0, y, VW, 1);
  if (Math.random() < 0.12) { const n = 1 + Math.random() * 3 | 0; for (let k = 0; k < n; k++) { const y = Math.random() * VH | 0, h = 2 + Math.random() * 10 | 0, dx = (Math.random() - .5) * 24 | 0; ctx.drawImage(cv, 0, y, VW, h, dx, y, VW, h); } }
  if (Math.random() < 0.025) { ctx.fillStyle = "rgba(255,0,32,0.14)"; ctx.fillRect(0, 0, VW, VH); }
  for (let k = 0; k < 18; k++) { ctx.fillStyle = Math.random() < .5 ? "#ff0030" : "#ffffff"; ctx.globalAlpha = Math.random() * .35; ctx.fillRect(Math.random() * VW | 0, Math.random() * VH | 0, 1 + Math.random() * 4 | 0, 1); }
  ctx.globalAlpha = 1;
}
function render() {
  if (!L || state === "title") { drawTitleBg(); return; }
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - .5) * shake), Math.round((Math.random() - .5) * shake));
  drawBg(); drawTiles(); drawBetray(); drawEnts(); drawMobs(); drawBoss(); drawPots(); drawPlayer(); drawWhip(); drawShots(); drawParts();
  ctx.restore();
  drawCombatHud(); drawBossHud();
  if (L.glitch) glitchFx();
  if (player && player.dead && player.deadT < 20) { ctx.fillStyle = "rgba(5,4,15," + (1 - player.deadT / 20) + ")"; ctx.fillRect(0, 0, VW, VH); }
}
buildMenu();
requestAnimationFrame(loop);
</script>
